<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Berry Professional Prompter</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    display: flex; flex-direction: column;
  }

  /* ---------- Controls ---------- */
  /* In edit mode, controls sit in normal flow (pushes edit screen down).
     Once the teleprompter is running (body.stage-active), controls switch
     to a fixed overlay so they float above the scrolling text. */
  #controls {
    position: static; flex-shrink: 0;
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px;
    padding: 10px 14px 10px 14px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: rgba(18,18,18,0.97);
    border-bottom: 1px solid #2c2c2c;
    z-index: 10;
    max-height: 40vh;
    overflow-y: auto;
    width: 100%;
  }
  body.stage-active #controls {
    display: none;
  }
  #controls label { font-size: 11px; color: #999; display: flex; flex-direction: column; gap: 3px; }
  #controls input[type=range] { width: 90px; }
  #controls input[type=number] { width: 55px; background:#111; color:#fff; border:1px solid #444; border-radius:4px; padding:4px 5px; }
  #controls select, #controls input[type=color] {
    background:#111; color:#fff; border:1px solid #444; border-radius:4px; padding:4px 5px;
  }
  #controls input[type=color] { width: 40px; height: 28px; padding: 2px; }

  button {
    background: #2563eb; color: #fff; border: none; border-radius: 6px;
    padding: 9px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    white-space: nowrap;
  }
  button:active { background: #1d4ed8; }
  button.secondary { background: #333; }
  button.secondary:active { background: #444; }
  button.small { padding: 6px 10px; font-size: 12px; }

  #btnRow { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; order: -1; margin-bottom: 4px; }

  /* ---------- Edit screen ---------- */
  #editWrap {
    display: flex; flex-direction: column;
    flex: 1 1 auto; min-height: 0;
  }
  #editHeader {
    display: flex; gap: 8px; padding: 10px 14px;
    background: #111; border-bottom: 1px solid #2c2c2c; align-items: center; flex-wrap: wrap;
  }
  #logoBar {
    display: flex; justify-content: center; align-items: center;
    padding: 10px 14px; background: #fff; border-bottom: 1px solid #2c2c2c;
  }
  #logoBar img { max-height: 60px; width: auto; display: block; }
  #editHeader select { background:#1a1a1a; color:#fff; border:1px solid #444; border-radius:4px; padding:6px 8px; flex: 1; min-width: 100px; }
  #scriptName { flex: 1; min-width: 100px; background:#1a1a1a; color:#fff; border:1px solid #444; border-radius:4px; padding:6px 8px; }

  #textInput {
    flex: 1; width: 100%; background: #000; color: #fff;
    outline: none; overflow-y: auto;
    font-size: 20px; line-height: 1.5; padding: 20px 24px;
    font-family: inherit; white-space: pre-wrap;
  }
  #textInput:empty:before {
    content: attr(data-placeholder);
    color: #555;
  }

  #selectionBar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 14px; background: #0d0d0d; border-bottom: 1px solid #2c2c2c;
  }
  #selectionBar #selectionLabel { font-size: 12px; color: #999; }
  #selectionBar input[type=color] {
    width: 36px; height: 28px; padding: 2px;
    background:#111; border:1px solid #444; border-radius:4px;
  }

  /* ---------- Stage ---------- */
  #stage {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: none; overflow: hidden; background: #000;
  }
  #stage.active { display: block; }

  #mirrorFlip { width: 100%; height: 100%; }

  #scrollArea {
    position: absolute; left: 0; right: 0; top: 100%;
    padding: 0 8%;
    will-change: transform;
  }

  #promptText {
    line-height: 1.5;
    font-weight: 600;
    text-align: center;
    white-space: pre-wrap;
  }

  #centerLine {
    position: fixed; left: 0; right: 0; top: 50%;
    height: 2px; background: rgba(255,80,80,0.55);
    pointer-events: none; z-index: 5; display: none;
  }
  #centerLine.on { display: block; }

  #guideArrow {
    position: fixed; top: 50%; transform: translateY(-50%);
    width: 0; height: 0; z-index: 8; pointer-events: none;
    display: none;
    filter: drop-shadow(0 0 4px rgba(0,0,0,0.8));
  }
  #guideArrow.left {
    left: 16px;
    border-top: 30px solid transparent;
    border-bottom: 30px solid transparent;
    border-left: 44px solid #22ff5c;
  }
  #guideArrow.right {
    right: 16px;
    border-top: 30px solid transparent;
    border-bottom: 30px solid transparent;
    border-right: 44px solid #22ff5c;
  }

  #countdown {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    font-size: 140px; font-weight: 700; color: #fff;
    background: rgba(0,0,0,0.85); z-index: 20;
  }
  #countdown.show { display: flex; }

  #exitHint {
    position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #555; z-index: 10; display: none;
    background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 10px;
  }
  #stage.active ~ #exitHint { display: block; }

  #padStatus {
    position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 10px;
    font-size: 11px; color: #4ade80; background: rgba(0,0,0,0.6);
    padding: 4px 8px; border-radius: 8px; z-index: 15; display: none;
  }
  #padStatus.on { display: block; }

  select#fontFamily { min-width: 110px; }
</style>
</head>
<body>

<div id="controls">
  <div id="btnRow">
    <button id="startBtn">▶ Start</button>
    <button id="pauseBtn" class="secondary">⏸ Pause</button>
    <button id="resetBtn" class="secondary">⟲ Reset</button>
    <button id="editBtn" class="secondary">✎ Edit</button>
  </div>

  <label>Speed
    <input type="range" id="speed" min="10" max="220" value="60">
  </label>
  <label>Font size
    <input type="number" id="fontSize" min="20" max="140" value="48">
  </label>
  <label>Font
    <select id="fontFamily">
      <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" selected>System Sans</option>
      <option value="Georgia, 'Times New Roman', serif">Serif</option>
      <option value="'Courier New', monospace">Monospace</option>
      <option value="'Avenir Next', Avenir, sans-serif">Avenir</option>
      <option value="Verdana, Geneva, sans-serif">Verdana</option>
    </select>
  </label>
  <label>Text color
    <input type="color" id="textColor" value="#ffffff">
  </label>
  <label>Background
    <input type="color" id="bgColor" value="#000000">
  </label>
  <label>Flip horizontal
    <select id="mirror">
      <option value="off">Off</option>
      <option value="on">On (beam-splitter)</option>
    </select>
  </label>
  <label>Flip vertical
    <select id="flipV">
      <option value="off">Off</option>
      <option value="on">On</option>
    </select>
  </label>
  <label>Text align
    <select id="textAlign">
      <option value="center">Center</option>
      <option value="left" selected>Left</option>
      <option value="right">Right</option>
    </select>
  </label>
  <label>Center line
    <select id="guideToggle">
      <option value="off">Off</option>
      <option value="on">On</option>
    </select>
  </label>
  <label>Side arrow
    <select id="arrowToggle">
      <option value="off">Off</option>
      <option value="left">Left side</option>
      <option value="right" selected>Right side</option>
    </select>
  </label>
  <label>Countdown
    <select id="countdownToggle">
      <option value="3">3s</option>
      <option value="0">Off</option>
      <option value="5">5s</option>
    </select>
  </label>
</div>

  <div id="editHeader">
    <select id="scriptSelect"></select>
    <input type="text" id="scriptName" placeholder="Script name">
    <button class="small" id="saveScriptBtn">💾 Save</button>
    <button class="small secondary" id="newScriptBtn">＋ New</button>
    <button class="small secondary" id="deleteScriptBtn">🗑</button>
    <button class="small secondary" id="importBtn">📂 Import .txt</button>
    <input type="file" id="importFile" accept=".txt,text/plain" style="display:none;">
    <button class="small secondary" id="exportBtn">⬇ Export .txt</button>
  </div>
  <div id="selectionBar">
    <span id="selectionLabel">Selected text:</span>
    <input type="color" id="selectionColor" value="#ffff00">
    <button class="small" id="applySelectionColorBtn">Apply color</button>
    <input type="number" id="selectionFontSize" min="10" max="200" value="48" style="width:55px; background:#111; color:#fff; border:1px solid #444; border-radius:4px; padding:4px 5px;">
    <button class="small" id="applySelectionSizeBtn">Apply size</button>
    <button class="small secondary" id="clearFormattingBtn">Clear formatting</button>
  </div>
  <div id="textInput" contenteditable="true" data-placeholder="Paste or type your script here..."></div>
</div>

  <div id="mirrorFlip">
    <div id="scrollArea"><div id="promptText"></div></div>
  </div>
</div>

<div id="countdown"></div>

<script>
/* ---------------- Elements ---------------- */
const textInput = document.getElementById('textInput');
const editWrap = document.getElementById('editWrap');
const stage = document.getElementById('stage');
const scrollArea = document.getElementById('scrollArea');
const promptText = document.getElementById('promptText');
const mirrorFlip = document.getElementById('mirrorFlip');
const centerLine = document.getElementById('centerLine');
const guideArrow = document.getElementById('guideArrow');
const countdownEl = document.getElementById('countdown');
const padStatus = document.getElementById('padStatus');

const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');
const editBtn = document.getElementById('editBtn');
const speedSlider = document.getElementById('speed');
const fontSizeInput = document.getElementById('fontSize');
const fontFamilySelect = document.getElementById('fontFamily');
const textColorInput = document.getElementById('textColor');
const bgColorInput = document.getElementById('bgColor');
const mirrorSelect = document.getElementById('mirror');
const flipVSelect = document.getElementById('flipV');
const guideToggle = document.getElementById('guideToggle');
const textAlignSelect = document.getElementById('textAlign');
const arrowToggle = document.getElementById('arrowToggle');
const countdownToggle = document.getElementById('countdownToggle');

const scriptSelect = document.getElementById('scriptSelect');
const scriptName = document.getElementById('scriptName');
const saveScriptBtn = document.getElementById('saveScriptBtn');
const newScriptBtn = document.getElementById('newScriptBtn');
const deleteScriptBtn = document.getElementById('deleteScriptBtn');
const importBtn = document.getElementById('importBtn');
const importFile = document.getElementById('importFile');
const exportBtn = document.getElementById('exportBtn');
const selectionColor = document.getElementById('selectionColor');
const applySelectionColorBtn = document.getElementById('applySelectionColorBtn');
const selectionFontSize = document.getElementById('selectionFontSize');
const applySelectionSizeBtn = document.getElementById('applySelectionSizeBtn');
const clearFormattingBtn = document.getElementById('clearFormattingBtn');

/* ---------------- Script storage (local, on-device) ---------------- */
const STORAGE_KEY = 'teleprompter_scripts_v1';
let scripts = {};
let currentScript = null;

function loadScripts() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    scripts = raw ? JSON.parse(raw) : {};
  } catch(e) { scripts = {}; }
}
function persistScripts() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(scripts)); } catch(e) {}
}
function refreshScriptSelect() {
  scriptSelect.innerHTML = '<option value="">— saved scripts —</option>';
  Object.keys(scripts).forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    if (name === currentScript) opt.selected = true;
    scriptSelect.appendChild(opt);
  });
}
scriptSelect.addEventListener('change', () => {
  const name = scriptSelect.value;
  if (!name) return;
  textInput.innerHTML = scripts[name];
  scriptName.value = name;
  currentScript = name;
});
saveScriptBtn.addEventListener('click', () => {
  const name = scriptName.value.trim();
  if (!name) { scriptName.focus(); return; }
  scripts[name] = textInput.innerHTML;
  currentScript = name;
  persistScripts();
  refreshScriptSelect();
});
newScriptBtn.addEventListener('click', () => {
  textInput.innerHTML = '';
  scriptName.value = '';
  currentScript = null;
  scriptSelect.value = '';
  textInput.focus();
});
deleteScriptBtn.addEventListener('click', () => {
  const name = scriptSelect.value;
  if (!name) return;
  delete scripts[name];
  persistScripts();
  refreshScriptSelect();
});

/* Import a plain .txt file into the editor. Plain text only — no colors or
   custom sizes carry over, since a .txt file can't hold that. Each line
   becomes its own paragraph so line breaks are preserved. */
importBtn.addEventListener('click', () => importFile.click());
importFile.addEventListener('change', () => {
  const file = importFile.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const text = String(reader.result);
    const escaped = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    textInput.innerHTML = escaped.split('\n').join('<br>');
    scriptName.value = file.name.replace(/\.txt$/i, '');
    currentScript = null;
    scriptSelect.value = '';
  };
  reader.readAsText(file);
  importFile.value = ''; // allow re-importing the same file name later
});

/* Export the current script as a plain .txt file — a portable backup outside
   the browser. Colors/sizes are not included (see note above); those live
   only in the on-device Saved Scripts list. */
exportBtn.addEventListener('click', () => {
  const plainText = textInput.innerText;
  const filename = (scriptName.value.trim() || 'script') + '.txt';
  const blob = new Blob([plainText], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
loadScripts();
refreshScriptSelect();

/* ---------------- Style application ---------------- */
function applyStyles() {
  promptText.style.fontSize = fontSizeInput.value + 'px';
  promptText.style.fontFamily = fontFamilySelect.value;
  promptText.style.color = textColorInput.value;
  stage.style.background = bgColorInput.value;

  // Live preview in the edit screen too, so you don't have to hit Start to see it
  textInput.style.fontSize = fontSizeInput.value + 'px';
  textInput.style.fontFamily = fontFamilySelect.value;
  textInput.style.color = textColorInput.value;
  editWrap.style.background = bgColorInput.value;

  promptText.style.textAlign = textAlignSelect.value;
  textInput.style.textAlign = textAlignSelect.value;
}
textAlignSelect.addEventListener('input', applyStyles);
[fontSizeInput, fontFamilySelect, textColorInput, bgColorInput].forEach(el =>
  el.addEventListener('input', applyStyles)
);

function applyFlip() {
  const h = mirrorSelect.value === 'on' ? -1 : 1;
  const v = flipVSelect.value === 'on' ? -1 : 1;
  stage.style.transform = `scale(${h}, ${v})`;
}
mirrorSelect.addEventListener('change', applyFlip);
flipVSelect.addEventListener('change', applyFlip);
guideToggle.addEventListener('change', () => {
  centerLine.classList.toggle('on', guideToggle.value === 'on');
});
arrowToggle.addEventListener('change', () => {
  guideArrow.classList.remove('left', 'right');
  if (arrowToggle.value === 'left' || arrowToggle.value === 'right') {
    guideArrow.classList.add(arrowToggle.value);
    guideArrow.style.display = 'block';
  } else {
    guideArrow.style.display = 'none';
  }
});

/* ---------------- Selection coloring (highlight part of the script) ---------------- */
let savedRange = null;
textInput.addEventListener('mouseup', saveSelectionRange);
textInput.addEventListener('touchend', saveSelectionRange);
textInput.addEventListener('keyup', saveSelectionRange);
function saveSelectionRange() {
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
    savedRange = sel.getRangeAt(0).cloneRange();
  }
}
applySelectionColorBtn.addEventListener('click', () => {
  textInput.focus();
  const sel = window.getSelection();
  if (savedRange) {
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }
  if (!sel || sel.isCollapsed) return; // nothing selected, nothing to do
  try {
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('foreColor', false, selectionColor.value);
  } catch (e) { /* not fatal */ }
});

/* Custom font size on a selection needs manual DOM wrapping — execCommand's
   fontSize only supports 7 legacy fixed sizes, not arbitrary pixel values. */
applySelectionSizeBtn.addEventListener('click', () => {
  textInput.focus();
  const sel = window.getSelection();
  if (savedRange) {
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  const span = document.createElement('span');
  span.style.fontSize = selectionFontSize.value + 'px';
  try {
    range.surroundContents(span);
  } catch (e) {
    // Selection spans multiple partial elements — extract and re-wrap instead
    const content = range.extractContents();
    span.appendChild(content);
    range.insertNode(span);
  }
  sel.removeAllRanges();
});
clearFormattingBtn.addEventListener('click', () => {
  textInput.focus();
  const sel = window.getSelection();
  if (savedRange) {
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }
  if (!sel || sel.isCollapsed) return;
  try { document.execCommand('removeFormat', false, null); } catch (e) {}
});

if (!textInput.innerHTML.trim()) {
  textInput.innerHTML = 'Welcome to <span style="color:#ff0000; font-size:60px;">Berry</span> Professional Prompter.<br><br>' +
    'Paste your script here, <span style="color:#ffff00;">adjust color, font, and size</span> above, then hit <span style="color:#22c55e;">Start</span>.<br><br>' +
    'To color part of the text: select/highlight a word or phrase, pick a color, then tap "Apply to selection."<br><br>' +
    'Pair your PS4 controller in iPad Settings &gt; Bluetooth first. Once connected: X = Start/Pause, Square = Reset, Triangle = flip, D-pad/R2-L2/right stick = Speed, Circle = Exit.<br><br>' +
    'Tap the scrolling text anytime to pause.';
}

/* ---------------- Wake lock (keep screen on) ---------------- */
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) { /* not fatal */ }
}
document.addEventListener('visibilitychange', async () => {
  if (wakeLock !== null && document.visibilityState === 'visible' && stage.classList.contains('active')) {
    requestWakeLock();
  }
});

/* ---------------- Stage control ---------------- */
let posY = 0, running = false, rafId = null, lastTime = null;

function enterStage() {
  promptText.innerHTML = textInput.innerHTML;
  applyStyles();
  editWrap.style.display = 'none';
  stage.classList.add('active');
  document.body.classList.add('stage-active');
  posY = 0;
  scrollArea.style.transform = 'translateY(0px)';
  requestWakeLock();
}
function exitStage() {
  stopScroll();
  stage.classList.remove('active');
  document.body.classList.remove('stage-active');
  editWrap.style.display = 'flex';
  if (wakeLock) { wakeLock.release().catch(()=>{}); wakeLock = null; }
}
function step(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  posY += Number(speedSlider.value) * dt;
  scrollArea.style.transform = `translateY(-${posY}px)`;
  rafId = requestAnimationFrame(step);
}
function startScroll() {
  if (running) return;
  running = true; lastTime = null;
  rafId = requestAnimationFrame(step);
}
function stopScroll() {
  running = false;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null; lastTime = null;
}
function toggleScroll() { if (running) stopScroll(); else startScroll(); }
function resetScroll() {
  stopScroll(); posY = 0;
  scrollArea.style.transform = 'translateY(0px)';
}
function runCountdownThenStart() {
  const secs = Number(countdownToggle.value);
  if (secs <= 0) { startScroll(); return; }
  let remaining = secs;
  countdownEl.textContent = remaining;
  countdownEl.classList.add('show');
  const iv = setInterval(() => {
    remaining -= 1;
    if (remaining <= 0) {
      clearInterval(iv);
      countdownEl.classList.remove('show');
      startScroll();
    } else {
      countdownEl.textContent = remaining;
    }
  }, 1000);
}

startBtn.addEventListener('click', () => {
  if (!stage.classList.contains('active')) enterStage();
  runCountdownThenStart();
});
pauseBtn.addEventListener('click', toggleScroll);
resetBtn.addEventListener('click', resetScroll);
editBtn.addEventListener('click', exitStage);
/* Tap to pause/resume. Drag up/down to manually scrub to any point in the
   script — dragging pauses auto-scroll and moves the text with your finger;
   lifting your finger leaves it paused right there so you can tap once more
   to resume reading from that spot. */
let dragStartY = null, dragStartPos = 0, isDragging = false;
const DRAG_THRESHOLD = 10; // px of movement before it counts as a drag, not a tap

stage.addEventListener('pointerdown', (e) => {
  dragStartY = e.clientY;
  dragStartPos = posY;
  isDragging = false;
  if (running) stopScroll();
});
stage.addEventListener('pointermove', (e) => {
  if (dragStartY === null) return;
  const deltaY = e.clientY - dragStartY;
  if (!isDragging && Math.abs(deltaY) > DRAG_THRESHOLD) isDragging = true;
  if (isDragging) {
    const newPos = Math.max(0, dragStartPos - deltaY);
    posY = newPos;
    scrollArea.style.transform = `translateY(-${posY}px)`;
  }
});
function endStageDrag(e) {
  if (dragStartY === null) return;
  if (!isDragging) toggleScroll(); // it was just a tap
  dragStartY = null; isDragging = false;
}
stage.addEventListener('pointerup', endStageDrag);
stage.addEventListener('pointercancel', endStageDrag);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') exitStage();
  if (e.key === ' ' && stage.classList.contains('active')) { e.preventDefault(); toggleScroll(); }
});

/* ---------------- Gamepad support (PS4 controller via Bluetooth) ----------------
   Pair the controller in iPad Settings > Bluetooth first. Safari (16.4+) exposes
   it through the standard Gamepad API. Standard mapping buttons:
   0 = Cross (X)      -> play/pause
   1 = Circle         -> exit to edit
   2 = Square          -> reset
   3 = Triangle        -> toggle mirror
   12 = D-pad Up       -> speed up (small step)
   13 = D-pad Down     -> speed down (small step)
   Right stick (vertical) -> speed throttle: push up = faster, down = slower
   R2 (analog)         -> ramps speed up while held, harder press = faster ramp
   L2 (analog)         -> ramps speed down while held, harder press = faster ramp
------------------------------------------------------------------------------ */
let gamepadIndex = null;
let padPollId = null;
let lastButtonState = {};

window.addEventListener('gamepadconnected', (e) => {
  gamepadIndex = e.gamepad.index;
  padStatus.classList.add('on');
  if (!padPollId) padPollId = requestAnimationFrame(pollGamepad);
});
window.addEventListener('gamepaddisconnected', () => {
  gamepadIndex = null;
  padStatus.classList.remove('on');
});

function buttonJustPressed(padId, index, pressed) {
  const key = padId + '_' + index;
  const was = lastButtonState[key] || false;
  lastButtonState[key] = pressed;
  return pressed && !was;
}

const STICK_DEADZONE = 0.15;
const MIN_SPEED = Number(speedSlider.min);
const MAX_SPEED = Number(speedSlider.max);

function pollGamepad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const gp of pads) {
    if (!gp) continue;
    const id = gp.index;

    /* Right stick vertical axis (axes[3] in standard mapping) acts as a
       throttle: push up = faster scroll, push down = slower. Only takes
       over once you move it past the deadzone, so it won't fight the
       slider or triggers when centered. */
    if (gp.axes && gp.axes.length > 3) {
      const ry = gp.axes[3];
      if (Math.abs(ry) > STICK_DEADZONE) {
        // ry is -1 (up) to 1 (down); invert so up = faster
        const t = (-ry + 1) / 2; // 0..1
        const newSpeed = Math.round(MIN_SPEED + t * (MAX_SPEED - MIN_SPEED));
        speedSlider.value = newSpeed;
      }
    }

    /* R2 / L2 analog triggers (buttons[7] / buttons[6]) ramp speed up or
       down continuously while held, scaled by how far they're pressed. */
    const r2 = gp.buttons[7];
    const l2 = gp.buttons[6];
    const RAMP_RATE = 90; // max speed units per second at full trigger press
    if (r2 && r2.value > 0.05) {
      const next = Number(speedSlider.value) + r2.value * RAMP_RATE * (1/60);
      speedSlider.value = Math.min(MAX_SPEED, next);
    }
    if (l2 && l2.value > 0.05) {
      const next = Number(speedSlider.value) - l2.value * RAMP_RATE * (1/60);
      speedSlider.value = Math.max(MIN_SPEED, next);
    }

    if (gp.buttons[0] && buttonJustPressed(id, 0, gp.buttons[0].pressed)) {
      // Cross: start if not on stage, else toggle
      if (!stage.classList.contains('active')) { enterStage(); runCountdownThenStart(); }
      else toggleScroll();
    }
    if (gp.buttons[1] && buttonJustPressed(id, 1, gp.buttons[1].pressed)) {
      // Circle: exit
      if (stage.classList.contains('active')) exitStage();
    }
    if (gp.buttons[2] && buttonJustPressed(id, 2, gp.buttons[2].pressed)) {
      // Square: reset
      resetScroll();
    }
    if (gp.buttons[3] && buttonJustPressed(id, 3, gp.buttons[3].pressed)) {
      // Triangle: horizontal mirror toggle
      mirrorSelect.value = mirrorSelect.value === 'on' ? 'off' : 'on';
      applyFlip();
    }
    if (gp.buttons[12] && buttonJustPressed(id, 12, gp.buttons[12].pressed)) {
      speedSlider.value = Math.min(220, Number(speedSlider.value) + 10);
    }
    if (gp.buttons[13] && buttonJustPressed(id, 13, gp.buttons[13].pressed)) {
      speedSlider.value = Math.max(10, Number(speedSlider.value) - 10);
    }
  }
  padPollId = requestAnimationFrame(pollGamepad);
}

/* init */
applyStyles();
applyFlip();
arrowToggle.dispatchEvent(new Event('change'));

/* Register service worker for offline use — after first successful load,
   the whole app works with zero internet connection. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* not fatal */ });
  });
}
</script>

</body>
</html>
